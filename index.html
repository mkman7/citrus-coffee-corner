<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Citrus Radio</title>

  <link rel="icon" type="image/png" href="assets/favicon-32.png?v=2">
  <link rel="apple-touch-icon" href="assets/favicon-32.png?v=2">
  
  <meta name="description" content="Citrus Radio — the songs we used to play at the café." />
  <meta name="theme-color" content="#6f1f1b" />
  <style>
    :root {
      --cream: #fff6e8;
      --paper: rgba(255, 246, 232, 0.82);
      --brown: #3a211a;
      --burgundy: #6f1f1b;
      --soft-burgundy: #8a3a31;
      --gold: #d9af73;
      --shadow: rgba(31, 17, 12, .34);
    }

    * { box-sizing: border-box; }

    html, body {
      min-height: 100%;
      margin: 0;
    }

    body {
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--cream);
      background: #21130f;
      overflow-x: hidden;
    }

    .page {
      position: relative;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 26px;
      isolation: isolate;
    }

    .background {
      position: fixed;
      inset: 0;
      z-index: -3;
      background: #2a1812;
      overflow: hidden;
    }

    .slide {
      position: absolute;
      inset: -2%;
      background-size: cover;
      background-position: center;
      opacity: 0;
      transform: scale(1.06);
      animation: citrusFade 35s infinite;
      filter: saturate(.96) contrast(.93) brightness(.86);
    }

    .slide-1 { animation-delay: 0s; }
    .slide-2 { animation-delay: 7s; }
    .slide-3 { animation-delay: 14s; }
    .slide-4 { animation-delay: 21s; }
    .slide-5 { animation-delay: 28s; }

    @keyframes citrusFade {
      0% { opacity: 0; transform: scale(1.08); }
      7% { opacity: 1; }
      24% { opacity: 1; }
      34% { opacity: 0; transform: scale(1.02); }
      100% { opacity: 0; }
    }

    .grain {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background:
        radial-gradient(circle at 20% 10%, rgba(255, 218, 149, .22), transparent 28%),
        radial-gradient(circle at 75% 85%, rgba(111, 31, 27, .26), transparent 33%),
        linear-gradient(90deg, rgba(33, 19, 15, .75), rgba(33, 19, 15, .30), rgba(33, 19, 15, .70));
    }

    .grain::after {
      content: "";
      position: absolute;
      inset: 0;
      opacity: .11;
      background-image:
        repeating-linear-gradient(0deg, rgba(255,255,255,.06) 0 1px, transparent 1px 3px);
      mix-blend-mode: overlay;
    }

    .card {
      width: min(620px, 100%);
      padding: clamp(24px, 5vw, 42px);
      border-radius: 34px;
      background: var(--paper);
      color: var(--brown);
      border: 1px solid rgba(255,255,255,.45);
      box-shadow: 0 26px 80px var(--shadow);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      text-align: center;
    }

    .brand {
      font-family: Georgia, "Times New Roman", ui-serif, serif;
      font-size: clamp(48px, 12vw, 92px);
      line-height: .82;
      letter-spacing: -.075em;
      font-weight: 900;
      color: var(--burgundy);
      margin: 0 0 18px;
      text-transform: lowercase;
      text-shadow: 0 8px 20px rgba(111,31,27,.12);
    }

    .heart {
      display: block;
      font-size: 28px;
      color: var(--soft-burgundy);
      line-height: 1;
      margin-bottom: 4px;
      transform: rotate(-4deg);
    }

    .eyebrow {
      margin: 0 0 14px;
      font-size: 12px;
      letter-spacing: .22em;
      text-transform: uppercase;
      font-weight: 800;
      color: #7d4a38;
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", ui-serif, serif;
      font-size: clamp(31px, 5vw, 52px);
      line-height: .96;
      letter-spacing: -.05em;
    }

    .intro {
      max-width: 460px;
      margin: 18px auto 24px;
      font-size: 16px;
      line-height: 1.55;
      color: #5d3d31;
    }

    .player {
      background: rgba(255, 255, 255, .52);
      border: 1px solid rgba(112, 55, 42, .13);
      border-radius: 24px;
      padding: 12px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.5);
    }

    iframe {
      display: block;
      width: 100%;
      border: 0;
      border-radius: 16px;
    }

    .note {
      margin: 18px 0 0;
      color: #72503f;
      font-size: 13px;
      line-height: 1.45;
    }

    .coming {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 20px;
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(111,31,27,.10);
      color: var(--burgundy);
      font-weight: 800;
      font-size: 13px;
      letter-spacing: .01em;
    }

    .footer {
      position: fixed;
      left: 18px;
      right: 18px;
      bottom: 14px;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      color: rgba(255,246,232,.78);
      font-size: 12px;
      letter-spacing: .05em;
      text-transform: uppercase;
      z-index: 3;
      pointer-events: none;
    }

    @media (max-width: 620px) {
      .page { padding: 16px; align-items: end; padding-bottom: 64px; }
      .card { border-radius: 26px; }
      .footer { font-size: 10px; bottom: 10px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .slide { animation: none; }
      .slide-1 { opacity: 1; }
    }
    
    .visitor-counter {
    margin-top: 10px;
    font-size: 12px;
    opacity: 0.55;
    letter-spacing: 0.04em;
}
  </style>
</head>
